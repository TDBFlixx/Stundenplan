<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stundenplan</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     Signature-Idee: der Stundenplan verhält sich wie ein Cockpit-
     Display – eine leuchtende "Sweep-Line" wandert in Echtzeit
     durch den Tag, wie eine Tacho-/Instrumentennadel.
     ============================================================ */
  :root{
    --bg:#0A0D12;
    --bg-elevated:#0D1117;
    --surface:#12161E;
    --surface-2:#171C26;
    --border:#232935;
    --border-soft:#1B212C;
    --text:#E8EAED;
    --text-dim:#8B93A1;
    --text-faint:#4C5566;
    --accent-cyan:#4FD8E8;
    --accent-cyan-dim:rgba(79,216,232,0.14);
    --accent-amber:#FF9F4A;
    --accent-amber-dim:rgba(255,159,74,0.16);
      --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:8px;
    --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --font-sans: ui-sans-serif, -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body{
    background-image:
      radial-gradient(circle at 12% -10%, rgba(79,216,232,0.06), transparent 40%),
      radial-gradient(circle at 88% 0%, rgba(255,159,74,0.05), transparent 45%);
  }

  ::selection{ background:var(--accent-cyan-dim); color:var(--accent-cyan); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 22px 60px;
  }

  /* ---------- HEADER / COCKPIT CLOCK ---------- */

  header.dash{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    padding-bottom:22px;
    margin-bottom:22px;
    border-bottom:1px solid var(--border-soft);
  }

  .clock-block{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .clock-time{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-size:clamp(48px, 8vw, 76px);
    font-weight:600;
    line-height:1;
    letter-spacing:-0.02em;
    color:var(--text);
    text-shadow:0 0 28px rgba(79,216,232,0.18);
  }

  .clock-time .sep{
    color:var(--accent-cyan);
    animation:blink 2s steps(1) infinite;
  }

  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0.25;} }

  .clock-date{
    font-size:14px;
    color:var(--text-dim);
    text-transform:capitalize;
    letter-spacing:0.01em;
  }

  .status-block{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    min-width:220px;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  .status-pill.live{
    border-color:rgba(255,159,74,0.4);
    background:var(--accent-amber-dim);
    color:var(--accent-amber);
  }

  .status-pill .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-faint);
  }

  .status-pill.live .dot{
    background:var(--accent-amber);
    box-shadow:0 0 8px var(--accent-amber);
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.4); opacity:0.6; }
  }

  .status-detail{
    font-size:13px;
    color:var(--text-faint);
  }

  /* ---------- NAVIGATION ---------- */

  nav.controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:22px;
  }

  .nav-group{
    display:flex;
    align-items:center;
    gap:8px;
  }

  button{
    font-family:inherit;
    cursor:pointer;
  }

  .nav-btn{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:9px 16px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:500;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }

  .nav-btn:hover{ color:var(--text); border-color:#333c4c; }

  .nav-btn.primary{
    color:var(--accent-cyan);
    border-color:rgba(79,216,232,0.3);
    background:var(--accent-cyan-dim);
  }

  .nav-btn.icon{
    padding:9px 13px;
    font-size:15px;
    line-height:1;
  }

  .toggle-weekend{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:12.5px;
    color:var(--text-faint);
    user-select:none;
  }

  .switch{
    position:relative;
    width:34px; height:19px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--border);
    cursor:pointer;
    flex-shrink:0;
  }
  .switch .knob{
    position:absolute;
    top:2px; left:2px;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--text-faint);
    transition:transform .18s ease, background .18s ease;
  }
  .switch.on{ border-color:rgba(79,216,232,0.35); }
  .switch.on .knob{ transform:translateX(15px); background:var(--accent-cyan); }

  /* ---------- MAIN LAYOUT ---------- */

  .layout{
    display:grid;
    grid-template-columns:1fr 250px;
    gap:22px;
    align-items:start;
  }

  @media (max-width:920px){
    .layout{ grid-template-columns:1fr; }
  }

  /* ---------- TIMETABLE ---------- */

  .board{
    background:var(--bg-elevated);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    padding:18px;
    position:relative;
  }

  .day-headers{
    display:grid;
    margin-bottom:10px;
    padding-left:52px;
    gap:8px;
  }

  .day-header{
    text-align:center;
    padding:8px 4px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    letter-spacing:0.02em;
  }

  .day-header .num{
    display:block;
    font-size:11px;
    font-weight:400;
    color:var(--text-faint);
    margin-top:2px;
  }

  .day-header.is-today{
    color:var(--accent-cyan);
    background:var(--accent-cyan-dim);
  }
  .day-header.is-today .num{ color:var(--accent-cyan); opacity:0.8; }

  .grid-scroll{
    position:relative;
    display:flex;
  }

  .time-axis{
    width:52px;
    flex-shrink:0;
    position:relative;
    height:var(--grid-height, 760px);
  }

  .time-axis .mark{
    position:absolute;
    right:10px;
    transform:translateY(-50%);
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
  }

  .day-columns{
    flex:1;
    display:grid;
    gap:8px;
    position:relative;
    height:var(--grid-height, 760px);
  }

  .hour-line{
    position:absolute;
    left:0; right:0;
    height:1px;
    background:var(--border-soft);
    background: rgba(0, 255, 255, 0.158);
  }

  .day-col{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0));
    border-radius:12px;
  }

  .day-col.is-today{
    outline:1px solid rgba(79,216,232,0.18);
    outline-offset:-1px;
    background:rgba(79,216,232,0.02);
  }

  .lesson{
    position:absolute;
    left:3px; right:3px;
    border-radius:10px;
    border:1px solid var(--lesson-border, var(--border));
    background:var(--lesson-bg, var(--surface));
    padding:8px 9px;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .lesson .subj{
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lesson .meta{
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lesson .time{
    font-family:var(--font-mono);
    font-size:9.5px;
    color:var(--text-faint);
    margin-top:3px;
  }

  .lesson.is-live{
    border-color:var(--accent-amber);
    box-shadow:0 0 0 1px var(--accent-amber), 0 0 18px rgba(255,159,74,0.28);
    animation:live-glow 2.4s ease-in-out infinite;
  }
  @keyframes live-glow{
    0%,100%{ box-shadow:0 0 0 1px var(--accent-amber), 0 0 14px rgba(255,159,74,0.22); }
    50%{ box-shadow:0 0 0 1px var(--accent-amber), 0 0 24px rgba(255,159,74,0.4); }
  }

  .live-tag{
    position:absolute;
    top:6px; right:7px;
    font-size:8.5px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--accent-amber);
    background:rgba(10,13,18,0.7);
    padding:2px 5px;
    border-radius:5px;
  }

  /* sweep line */
  .sweep-line{
    position:absolute;
    left:0; right:0;
    height:0;
    border-top:1.5px solid var(--accent-amber);
    box-shadow:0 0 10px rgba(255,159,74,0.6);
    z-index:5;
    pointer-events:none;
    display:none;
  }
  .sweep-line .sweep-dot{
    position:absolute;
    left:-4px; top:-4.5px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--accent-amber);
    box-shadow:0 0 10px rgba(255,159,74,0.8);
  }
  .sweep-line .sweep-label{
    position:absolute;
    left:8px; top:-9px;
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--accent-amber);
    background:rgba(10,13,18,0.85);
    padding:1px 6px;
    border-radius:6px;
    border:1px solid rgba(255,159,74,0.35);
  }

  .empty-note{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-faint);
    font-size:12px;
  }

  /* ---------- SIDE PANEL ---------- */

  .side{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:16px;
  }

  .panel .eyebrow{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-faint);
    margin-bottom:10px;
  }

  .next-subject{
    font-size:19px;
    font-weight:700;
    color:var(--text);
    margin-bottom:4px;
  }
  .next-meta{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .next-countdown{
    margin-top:12px;
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--accent-cyan);
  }
  .next-empty{
    font-size:13.5px;
    color:var(--text-faint);
  }

  /* ---------- MOBILE ---------- */

  @media (max-width:920px){
    .day-headers{ display:none; }
    .board{ padding:14px; }

    .mobile-daybar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:14px;
      gap:10px;
    }
    .mobile-daylabel{
      font-size:16px;
      font-weight:700;
    }
    .mobile-daylabel .sub{
      display:block;
      font-size:12px;
      font-weight:400;
      color:var(--text-faint);
      margin-top:1px;
    }
  }

  @media (min-width:921px){
    .mobile-daybar{ display:none; }
  }

  footer.hint{
    margin-top:26px;
    font-size:11.5px;
    color:var(--text-faint);
    text-align:center;
  }
</style>
</head>
<body>

<div class="app">

  <header class="dash">
    <div class="clock-block">
      <div class="clock-time" id="clockTime">--<span class="sep">:</span>--</div>
      <div class="clock-date" id="clockDate">–</div>
    </div>
    <div class="status-block">
      <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Lädt …</span></div>
      <div class="status-detail" id="statusDetail"></div>
    </div>
  </header>

  <nav class="controls">
    <div class="nav-group">
      <button class="nav-btn primary" id="btnToday">Heute</button>
      <button class="nav-btn icon" id="btnPrev" aria-label="Vorheriger Tag">←</button>
      <button class="nav-btn icon" id="btnNext" aria-label="Nächster Tag">→</button>
      <button class="nav-btn" id="btnWeek">Aktuelle Woche</button>
    </div>
    <label class="toggle-weekend" id="weekendToggle">
      <span class="switch" id="weekendSwitch"><span class="knob"></span></span>
      Wochenende anzeigen
    </label>
  </nav>

  <div class="layout">
    <div class="board" id="board">

      <div class="mobile-daybar">
        <div class="mobile-daylabel" id="mobileDayLabel">–<span class="sub" id="mobileDaySub"></span></div>
      </div>

      <div class="day-headers" id="dayHeaders"></div>

      <div class="grid-scroll">
        <div class="time-axis" id="timeAxis"></div>
        <div class="day-columns" id="dayColumns"></div>
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <div class="eyebrow">Nächste Stunde</div>
        <div id="nextLessonBody"><div class="next-empty">Lädt …</div></div>
      </div>
    </aside>
  </div>

  <footer></footer>

</div>

<script>
/* =====================================================================
   KONFIGURATION – hier trägst du deine echten Daten ein.
   ===================================================================== */
const CONFIG = {

  // Unterrichtsstunden: zentral definierte Zeitraster.
  periods: [
    { start: "07:30", end: "08:15" },
    { start: "08:15", end: "09:00" },
    { start: "09:15", end: "10:00" },
    { start: "10:00", end: "10:45" },
    { start: "11:00", end: "11:45" },
    { start: "11:45", end: "12:30" },
    { start: "13:00", end: "13:45" },
    { start: "13:45", end: "14:30" },
  ],

  // Unterrichtsstunden. day: Mon | Tue | Wed | Thu | Fri | Sat | Sun
  lessons: [
    // Montag
    { subject: "UmÖko", teacher: "OTTS",  room: "B211", day: "Mon", start: "08:15", end: "09:00" },
    { subject: "UmÖko",    teacher: "OTTS",   room: "B211", day: "Mon", start: "09:15", end: "10:45" },
    { subject: "Mathe",   teacher: "Herr VLIN",   room: "B211", day: "Mon", start: "11:00", end: "12:30" },
    { subject: "Deutsch",      teacher: "Herr Bendick",  room: "B211", day: "Mon", start: "13:00", end: "13:45" },
    { subject: "Deutsch", teacher: "Herr Bendick", room: "B211", day: "Mon", start: "13:45", end: "14:30" },

    // Dienstag
    { subject: "TKMB",    teacher: "ROCH",   room: "CB051", day: "Tue", start: "07:30", end: "09:00" },
    { subject: "UmTech",    teacher: "MEIN",   room: "B211", day: "Tue", start: "09:15", end: "10:45" },
    { subject: "UmTech",    teacher: "MEIN",   room: "B115", day: "Tue", start: "11:00", end: "11:45" },
    { subject: "Ethik",      teacher: "BEBE",   room: "B211", day: "Tue", start: "13:00", end: "14:30" },

    // Mittwoch
     { subject: "Physik",    teacher: "BORM",  room: "B211", day: "Wed", start: "07:30", end: "09:00" },
    { subject: "Deutsch",    teacher: "Her Bendick",  room: "B211", day: "Wed", start: "09:15", end: "10:45" },
    { subject: "PoWi",      teacher: "DYCK",          room: "B211", day: "Wed", start: "11:00", end: "12:30" },
    { subject: "Englisch",   teacher: "Kleb",         room: "B211", day: "Wed", start: "13:00", end: "14:30" },

    // Donnerstag
    { subject: "Mathe",   teacher: "Herr VILN",   room: "B211", day: "Thu", start: "07:30", end: "09:00" },
    { subject: "Englisch",       teacher: "Kleb",    room: "B211", day: "Thu", start: "09:15", end: "10:45" },
    { subject: "Sport", teacher: "ROEV",  room: "S3", day: "Thu", start: "11:00", end: "12:30" },

    // Freitag
    { subject: "Chemie",       teacher: "MEIN",    room: "B211", day: "Fri", start: "07:30", end: "09:00" },
    { subject: "UmTech",       teacher: "MEIN",    room: "B211", day: "Fri", start: "09:15", end: "10:45" },
    { subject: "Geschichte", teacher: "Kleb",  room: "B211", day: "Fri", start: "11:00", end: "12:30" },
  ],
};

/* =====================================================================
   Ab hier: Anwendungslogik – normalerweise musst du nichts ändern.
   ===================================================================== */

const DAY_DEFS = [
  { key:"Mon", label:"Montag",     short:"Mo", jsIdx:1 },
  { key:"Tue", label:"Dienstag",   short:"Di", jsIdx:2 },
  { key:"Wed", label:"Mittwoch",   short:"Mi", jsIdx:3 },
  { key:"Thu", label:"Donnerstag", short:"Do", jsIdx:4 },
  { key:"Fri", label:"Freitag",    short:"Fr", jsIdx:5 },
  { key:"Sat", label:"Samstag",    short:"Sa", jsIdx:6 },
  { key:"Sun", label:"Sonntag",    short:"So", jsIdx:0 },
];

const SUBJECT_PALETTE = [
  { border:"#6C7CFF", bg:"rgba(108,124,255,0.12)" },
  { border:"#37C9B0", bg:"rgba(55,201,176,0.12)"  },
  { border:"#FF7A9E", bg:"rgba(255,122,158,0.12)" },
  { border:"#FFB25A", bg:"rgba(255,178,90,0.12)"  },
  { border:"#B084F0", bg:"rgba(176,132,240,0.12)" },
  { border:"#5BB8FF", bg:"rgba(91,184,255,0.12)"  },
  { border:"#A8D95C", bg:"rgba(168,217,92,0.12)"  },
  { border:"#FF8B66", bg:"rgba(255,139,102,0.12)" },
];

function subjectColor(name){
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return SUBJECT_PALETTE[h % SUBJECT_PALETTE.length];
}

function toMinutes(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

function fmtHM(dateOrMinutes){
  if (typeof dateOrMinutes === "number"){
    const h = Math.floor(dateOrMinutes/60), m = dateOrMinutes%60;
    return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
  }
  const d = dateOrMinutes;
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function dayKeyFromDate(date){
  const def = DAY_DEFS.find(d => d.jsIdx === date.getDay());
  return def ? def.key : null;
}

function startOfWeek(date){
  const d = new Date(date);
  const jsDay = d.getDay();
  const diffToMonday = (jsDay === 0 ? -6 : 1 - jsDay);
  d.setDate(d.getDate() + diffToMonday);
  d.setHours(0,0,0,0);
  return d;
}

function isSameDate(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

// Gesamtzeitspanne des Rasters (mit etwas Rand vor der ersten / nach der letzten Stunde)
const RANGE_START = Math.min(...CONFIG.periods.map(p => toMinutes(p.start))) - 15;
const RANGE_END   = Math.max(...CONFIG.periods.map(p => toMinutes(p.end))) + 15;
const RANGE_TOTAL = RANGE_END - RANGE_START;

function pctFromMinutes(min){
  return Math.min(100, Math.max(0, ((min - RANGE_START) / RANGE_TOTAL) * 100));
}

/* ---------------- Zustand ---------------- */

const state = {
  selectedDate: new Date(),
  showWeekend: false,
  isMobile: window.matchMedia("(max-width:920px)").matches,
};

/* ---------------- Rendering: Raster (bei Navigation) ---------------- */

function visibleDayDefs(){
  return state.showWeekend ? DAY_DEFS : DAY_DEFS.slice(0,5);
}

function weekDates(anchorDate){
  const monday = startOfWeek(anchorDate);
  const defs = visibleDayDefs();
  return defs.map(def => {
    const offset = def.jsIdx === 0 ? 6 : def.jsIdx - 1; // So am Ende der Woche
    const d = new Date(monday);
    d.setDate(monday.getDate() + offset);
    return { def, date: d };
  });
}

function lessonsFor(dayKey){
  return CONFIG.lessons.filter(l => l.day === dayKey).sort((a,b) => toMinutes(a.start)-toMinutes(b.start));
}

function buildTimeAxis(){
  const axis = document.getElementById("timeAxis");
  axis.innerHTML = "";
  const columnsEl = document.getElementById("dayColumns");

  // Marken an den tatsächlichen Start-/Endzeiten deiner Stunden (CONFIG.periods),
  // nicht an starren vollen Stunden. Doppelte Zeiten (Ende von Stunde N = Beginn
  // von Stunde N+1) werden automatisch zu einer Marke zusammengefasst.
  const times = new Set();
  CONFIG.periods.forEach(p => { times.add(toMinutes(p.start)); times.add(toMinutes(p.end)); });
  const sortedMinutes = Array.from(times).sort((a,b) => a-b);

  sortedMinutes.forEach(min => {
    const mark = document.createElement("div");
    mark.className = "mark";
    mark.style.top = pctFromMinutes(min) + "%";
    mark.textContent = fmtHM(min);
    axis.appendChild(mark);

    const line = document.createElement("div");
    line.className = "hour-line";
    line.style.top = pctFromMinutes(min) + "%";
    columnsEl.appendChild(line);
  });
}

function renderBoard(){
  const days = state.isMobile
    ? [{ def: DAY_DEFS.find(d => d.key === dayKeyFromDate(state.selectedDate)) || DAY_DEFS[0], date: state.selectedDate }]
    : weekDates(state.selectedDate);

  // Kopfzeile (Desktop)
  const headerEl = document.getElementById("dayHeaders");
  headerEl.style.gridTemplateColumns = `repeat(${days.length}, 1fr)`;
  headerEl.innerHTML = "";
  days.forEach(({def,date}) => {
    const today = isSameDate(date, new Date());
    const el = document.createElement("div");
    el.className = "day-header" + (today ? " is-today" : "");
    el.innerHTML = `${def.short}<span class="num">${date.getDate()}.${date.getMonth()+1}.</span>`;
    headerEl.appendChild(el);
  });

  // Mobile Tageslabel
  if (state.isMobile){
    const def = days[0].def, date = days[0].date;
    document.getElementById("mobileDayLabel").innerHTML =
      `${def.label}<span class="sub">${date.getDate()}.${date.getMonth()+1}.${date.getFullYear()}</span>`;
  }

  // Rasterhöhe
  const gridHeight = state.isMobile ? Math.max(560, window.innerHeight*0.62) : 760;
  document.documentElement.style.setProperty("--grid-height", gridHeight + "px");

  const columnsEl = document.getElementById("dayColumns");
  columnsEl.style.gridTemplateColumns = `repeat(${days.length}, 1fr)`;
  columnsEl.innerHTML = "";

  days.forEach(({def,date}) => {
    const today = isSameDate(date, new Date());
    const col = document.createElement("div");
    col.className = "day-col" + (today ? " is-today" : "");
    col.dataset.day = def.key;

    const dayLessons = lessonsFor(def.key);
    if (dayLessons.length === 0){
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "Frei";
      col.appendChild(note);
    }

    dayLessons.forEach(lesson => {
      const top = pctFromMinutes(toMinutes(lesson.start));
      const bottom = pctFromMinutes(toMinutes(lesson.end));
      const color = subjectColor(lesson.subject);

      const card = document.createElement("div");
      card.className = "lesson";
      card.dataset.day = def.key;
      card.dataset.start = lesson.start;
      card.dataset.end = lesson.end;
      card.style.top = top + "%";
      card.style.height = Math.max(bottom-top, 4) + "%";
      card.style.setProperty("--lesson-border", color.border);
      card.style.setProperty("--lesson-bg", color.bg);
      card.innerHTML = `
        <div class="subj">${lesson.subject}</div>
        <div class="meta">${lesson.teacher} · Raum ${lesson.room}</div>
        <div class="time">${lesson.start}–${lesson.end}</div>
      `;
      col.appendChild(card);
    });

    columnsEl.appendChild(col);
  });

  buildTimeAxis();

  // Sweep-Line Element neu einhängen (wird in tick() positioniert)
  const sweep = document.createElement("div");
  sweep.className = "sweep-line";
  sweep.id = "sweepLine";
  sweep.innerHTML = `<span class="sweep-dot"></span><span class="sweep-label" id="sweepLabel"></span>`;
  columnsEl.appendChild(sweep);

  tick(true);
}

/* ---------------- Live-Logik (jede Sekunde) ---------------- */

function currentLessonNow(now){
  const dayKey = dayKeyFromDate(now);
  if (!dayKey) return null;
  const nowMin = now.getHours()*60 + now.getMinutes();
  return lessonsFor(dayKey).find(l => nowMin >= toMinutes(l.start) && nowMin < toMinutes(l.end)) || null;
}

function nextLessonFrom(now){
  const nowMin = now.getHours()*60 + now.getMinutes();
  const todayKey = dayKeyFromDate(now);

  if (todayKey){
    const today = lessonsFor(todayKey).find(l => toMinutes(l.start) > nowMin);
    if (today) return { lesson: today, date: now };
  }

  // Nächsten Schultag suchen (max. 7 Tage voraus)
  for (let i = 1; i <= 7; i++){
    const d = new Date(now);
    d.setDate(d.getDate()+i);
    const key = dayKeyFromDate(d);
    if (!key) continue;
    const list = lessonsFor(key);
    if (list.length){
      return { lesson: list[0], date: d };
    }
  }
  return null;
}

function minutesUntil(now, targetDate, targetHHMM){
  const [h,m] = targetHHMM.split(":").map(Number);
  const t = new Date(targetDate);
  t.setHours(h,m,0,0);
  return Math.round((t - now)/60000);
}

function tick(forceFullRender){
  const now = new Date();

  // Uhr
  document.getElementById("clockTime").innerHTML =
    String(now.getHours()).padStart(2,"0") + '<span class="sep">:</span>' + String(now.getMinutes()).padStart(2,"0");
  document.getElementById("clockDate").textContent =
    now.toLocaleDateString("de-DE", { weekday:"long", day:"numeric", month:"long" });

  // Aktuelle Stunde markieren
  document.querySelectorAll(".lesson").forEach(el => {
    el.classList.remove("is-live");
    const tag = el.querySelector(".live-tag");
    if (tag) tag.remove();
  });

  const live = currentLessonNow(now);
  const todayKey = dayKeyFromDate(now);

  if (live && document.querySelector(`.day-col[data-day="${todayKey}"]`)){
    const el = document.querySelector(`.lesson[data-day="${todayKey}"][data-start="${live.start}"]`);
    if (el){
      el.classList.add("is-live");
      const tag = document.createElement("div");
      tag.className = "live-tag";
      tag.textContent = "LIVE";
      el.appendChild(tag);
    }
  }

  // Status-Pill
  const pill = document.getElementById("statusPill");
  const statusText = document.getElementById("statusText");
  const statusDetail = document.getElementById("statusDetail");

  if (!todayKey){
    pill.classList.remove("live");
    statusText.textContent = "Kein Schultag";
    statusDetail.textContent = "Heute findet kein Unterricht statt.";
  } else if (live){
    pill.classList.add("live");
    statusText.textContent = live.subject + " läuft";
    statusDetail.textContent = `noch ${Math.max(1, toMinutes(live.end) - (now.getHours()*60+now.getMinutes()))} Min. · Raum ${live.room}`;
  } else {
    pill.classList.remove("live");
    const todays = lessonsFor(todayKey);
    const nowMin = now.getHours()*60+now.getMinutes();
    const upcomingToday = todays.find(l => toMinutes(l.start) > nowMin);
    const firstToday = todays[0];
    if (firstToday && nowMin < toMinutes(firstToday.start)){
      statusText.textContent = "Schule beginnt in " + (toMinutes(firstToday.start)-nowMin) + " Min.";
      statusDetail.textContent = firstToday.subject + " um " + firstToday.start + " Uhr";
    } else if (upcomingToday){
      statusText.textContent = "Keine aktuelle Unterrichtsstunde";
      statusDetail.textContent = "Pause · als Nächstes " + upcomingToday.subject + " um " + upcomingToday.start;
    } else if (todays.length){
      statusText.textContent = "Schultag beendet";
      statusDetail.textContent = "Letzte Stunde: " + todays[todays.length-1].subject;
    } else {
      statusText.textContent = "Keine aktuelle Unterrichtsstunde";
      statusDetail.textContent = "Heute stehen keine Stunden an.";
    }
  }

  // Sweep-Line
  const sweep = document.getElementById("sweepLine");
  if (sweep){
    const nowMin = now.getHours()*60 + now.getMinutes();
    const hasTodayColumn = !!document.querySelector(`.day-col[data-day="${todayKey}"]`);
    if (todayKey && hasTodayColumn && nowMin >= RANGE_START && nowMin <= RANGE_END){
      sweep.style.display = "block";
      sweep.style.top = pctFromMinutes(nowMin) + "%";
      document.getElementById("sweepLabel").textContent = fmtHM(now);
    } else {
      sweep.style.display = "none";
    }
  }

  // Nächste-Stunde-Panel
  const next = nextLessonFrom(now);
  const body = document.getElementById("nextLessonBody");
  if (!next){
    body.innerHTML = `<div class="next-empty">Aktuell sind keine weiteren Stunden eingetragen.</div>`;
  } else {
    const sameDay = isSameDate(next.date, now);
    const mins = minutesUntil(now, next.date, next.lesson.start);
    const whenLabel = sameDay
      ? (mins <= 0 ? "jetzt" : `in ${mins} Min.`)
      : next.date.toLocaleDateString("de-DE", { weekday:"long" });
    body.innerHTML = `
      <div class="next-subject">${next.lesson.subject}</div>
      <div class="next-meta">${next.lesson.teacher} · Raum ${next.lesson.room}<br>${next.lesson.start}–${next.lesson.end} Uhr${sameDay ? "" : " · " + next.date.toLocaleDateString("de-DE",{day:"numeric",month:"numeric"})}</div>
      <div class="next-countdown">${whenLabel}</div>
    `;
  }

  // Beim ersten Render nach Navigation: aktuelle Stunde ins Sichtfeld scrollen (mobil)
  if (forceFullRender && state.isMobile){
    const liveEl = document.querySelector(".lesson.is-live");
    if (liveEl){
      liveEl.scrollIntoView({ behavior:"smooth", block:"center" });
    } else if (sweep && sweep.style.display === "block"){
      sweep.scrollIntoView({ behavior:"smooth", block:"center" });
    }
  }
}

/* ---------------- Navigation ---------------- */

function shiftDay(delta){
  const d = new Date(state.selectedDate);
  do {
    d.setDate(d.getDate() + delta);
  } while (!state.showWeekend && (d.getDay() === 0 || d.getDay() === 6));
  state.selectedDate = d;
  renderBoard();
}

document.getElementById("btnToday").addEventListener("click", () => {
  state.selectedDate = new Date();
  renderBoard();
});
document.getElementById("btnPrev").addEventListener("click", () => shiftDay(-1));
document.getElementById("btnNext").addEventListener("click", () => shiftDay(1));
document.getElementById("btnWeek").addEventListener("click", () => {
  state.selectedDate = new Date();
  renderBoard();
});

document.getElementById("weekendToggle").addEventListener("click", () => {
  state.showWeekend = !state.showWeekend;
  document.getElementById("weekendSwitch").classList.toggle("on", state.showWeekend);
  renderBoard();
});

/* Swipe-Navigation auf Mobilgeräten */
let touchStartX = null;
document.getElementById("board").addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
}, { passive:true });
document.getElementById("board").addEventListener("touchend", e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 55){ shiftDay(dx < 0 ? 1 : -1); }
  touchStartX = null;
}, { passive:true });

/* Breakpoint-Wechsel erkennen */
const mq = window.matchMedia("(max-width:920px)");
mq.addEventListener("change", e => {
  state.isMobile = e.matches;
  renderBoard();
});
window.addEventListener("resize", () => {
  if (state.isMobile) renderBoard();
});

/* ---------------- Start ---------------- */

renderBoard();
setInterval(tick, 1000);
</script>
